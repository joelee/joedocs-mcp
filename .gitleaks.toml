# gitleaks configuration: the built-in rules plus project allowlists.
# Changing this file requires approval (see AGENTS.md).

[extend]
useDefault = true

# JoeDocs API keys (`jd_<12 hex id>_<64 hex secret>`, see src/auth.rs). The
# built-in rules do not recognise the format. tests/secrets.rs checks this
# rule.
[[rules]]
id = "joedocs-api-key"
description = "JoeDocs API key"
regex = '''\bjd_[0-9a-fA-F]{12}_[0-9a-fA-F]{64}\b'''
keywords = ["jd_"]

# JoeDocs admin tokens (`jda_...`) and admin session tokens (`jds_...`), the
# same shape (JD-8 D-08). tests/secrets.rs checks these rules.
[[rules]]
id = "joedocs-admin-token"
description = "JoeDocs admin token"
regex = '''\bjda_[0-9a-fA-F]{12}_[0-9a-fA-F]{64}\b'''
keywords = ["jda_"]

[[rules]]
id = "joedocs-admin-session"
description = "JoeDocs admin session token"
regex = '''\bjds_[0-9a-fA-F]{12}_[0-9a-fA-F]{64}\b'''
keywords = ["jds_"]

# Allowlist a known false positive only with a reason, for example:
#
# [[allowlists]]
# description = "Test fixture with a fake key"
# paths = ['''tests/fixtures/fake_key\.pem''']
