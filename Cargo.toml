[package]
name = "joedocs"
version = "0.1.0"
edition = "2024"
# MSRV: application profile (see AGENTS.md). Bump together with
# rust-toolchain.toml.
rust-version = "1.99"
publish = false
description = "JoeDocs: a central MCP server for multi-project documentation"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
indexmap = { version = "2.14.2", default-features = false, features = ["std", "serde"] }
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "fallible_uint"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Lint levels live here, not in source attributes. They are warnings so local
# work is not blocked; CI turns every warning into an error with -D warnings.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
allow_attributes_without_reason = "warn"
