[package]
name = "joedocs"
version = "0.4.3"
edition = "2024"
# MSRV: application profile (see AGENTS.md). Bump together with
# rust-toolchain.toml.
rust-version = "1.99"
description = "A central MCP server for multi-project documentation: Markdown with front matter, git history and full-text search"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/joelee/joedocs-mcp"
homepage = "https://github.com/joelee/joedocs-mcp"
keywords = ["mcp", "documentation", "markdown", "obsidian", "server"]
categories = ["command-line-utilities", "development-tools"]
# Only what is needed to build the binary and read about it.
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/config.example.toml",
    "/templates/**/*",
]

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
flate2 = "1.1.11"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hmac = { version = "0.13.0", default-features = false }
indexmap = { version = "2.14.2", default-features = false, features = ["std", "serde"] }
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
toml = "1.1.8"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"

# Lint levels live here, not in source attributes. They are warnings so local
# work is not blocked; CI turns every warning into an error with -D warnings.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
allow_attributes_without_reason = "warn"
