# Weekly update proposals. Every PR runs CI, including cargo deny.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  # The runtime base (debian:trixie-slim) is pinned by digest in the
  # Dockerfile. The build stage's rust image follows rust-toolchain.toml,
  # which changes only in a toolchain bump, so it is left out.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: rust
