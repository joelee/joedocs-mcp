# Runs the same gate as `just ci` (see AGENTS.md) on Linux and macOS, plus
# the Docker Compose deployment tests. Actions and tools are pinned; bump
# them deliberately (Dependabot proposes action updates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  TOOLS: just@1.59.0,cargo-nextest@0.9.145,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            gitleaks_asset: linux_x64
            gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
            actionlint_asset: linux_amd64
            actionlint_sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          - os: macos-15
            gitleaks_asset: darwin_arm64
            gitleaks_sha256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
            actionlint_asset: darwin_arm64
            actionlint_sha256: aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: ${{ env.TOOLS }}

      - name: Install gitleaks
        env:
          ASSET: ${{ matrix.gitleaks_asset }}
          SHA256: ${{ matrix.gitleaks_sha256 }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_${ASSET}.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # taiki-e/install-action has no actionlint manifest, so download the
      # release and check it like gitleaks.
      - name: Install actionlint
        env:
          ASSET: ${{ matrix.actionlint_asset }}
          SHA256: ${{ matrix.actionlint_sha256 }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_${ASSET}.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" actionlint

      - name: just ci
        run: just ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/**/nextest/ci/junit.xml
          if-no-files-found: ignore

  docker:
    name: just docker-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0,cargo-nextest@0.9.145

      - name: just docker-test
        run: just docker-test
