# Publishes a release when a signed tag is pushed (see the release steps in
# docs/developer-guide.md). A tag vX.Y.Z is a production release; a tag
# vX.Y.Z-<pre> (a SemVer pre-release, such as v0.5.6-dev) is a pre-release.
#
# 1. verify: the tag matches Cargo.toml, CHANGELOG.md has its section, the
#    tagged commit is on main, and GitHub reports the tag signature verified.
#    It says whether the version is a pre-release.
# 2. ci: the full CI gate (ci.yml) on the tagged commit.
# 3. binaries (alongside ci): builds the release binaries, Linux x86_64 and
#    aarch64 (static, musl) and macOS Apple silicon, checks each, and keeps
#    them as workflow artifacts. Nothing is published here.
# 4. advisories (alongside ci): `cargo deny check advisories`. An active
#    RustSec advisory fails a production release here, so nothing is
#    published; a pre-release goes on and lists the advisories in its notes.
# 5. Production: publish waits for approval in the `release` environment,
#    publishes to crates.io with Trusted Publishing (no stored token), then
#    asks the Homebrew tap to bump the formula.
#    Pre-release: approve-prerelease waits for approval in the same
#    environment. Nothing goes to crates.io or Homebrew.
# 6. github-release: creates the GitHub release from the CHANGELOG section,
#    with the binaries, their SHA256SUMS and a build-provenance attestation
#    for each. A pre-release is marked Pre-release (never Latest), and its
#    notes add the active advisories and "Not for production use."
# 7. Container images: image (after binaries) builds the Dockerfile's
#    `release` target from the Linux binaries and smoke-tests the amd64
#    image (no volumes; healthy; the first-run banner). image-publish, after
#    github-release and a second approval in the `release` environment (its
#    Docker Hub token is an environment secret), checks the binaries against
#    the release's SHA256SUMS and pushes linux/amd64 and linux/arm64 to
#    docker.io/joeworks/joedocs and ghcr.io/joelee/joedocs, with SBOM and
#    provenance attestations and a GitHub attestation of the digest. A
#    pre-release gets only its exact version tag; a production release gets
#    X.Y.Z, X.Y and latest.
#
# Run it by hand (workflow_dispatch) for a dry run: verify (without the tag
# checks), ci, binaries, advisories, `cargo publish --dry-run`, and image
# (both platforms built, the amd64 one smoke-tested). A dry run never
# publishes, releases, dispatches, pushes or attests.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (publishing happens only from a tag push)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check needs main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, CHANGELOG, branch and signature
        id: check
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || fail "cannot read the version from Cargo.toml"
          grep -qF "## [$version] - " CHANGELOG.md \
            || fail "CHANGELOG.md has no '## [$version] - <date>' section"
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$DRY_RUN" = true ] \
              || fail "a manual run is always a dry run; publish by pushing a signed tag"
            echo "Dry run for $version: tag checks skipped"
          else
            [ "$TAG" = "v$version" ] || fail "tag $TAG does not match Cargo.toml version $version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || fail "$TAG is not on main"
            read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
            [ "$type" = tag ] || fail "$TAG is a lightweight tag; create it with git tag -s"
            verified="$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.verified')"
            [ "$verified" = true ] \
              || fail "GitHub does not report a verified signature on $TAG; sign it with git tag -s and add the key to your GitHub account"
          fi
          # A SemVer pre-release part (X.Y.Z-<pre>) makes a GitHub pre-release.
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  # Release builds use no cache, so a poisoned cache cannot reach them.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl-gcc (SQLite and ring compile C)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary
        run: |
          fail() { echo "::error::$*"; exit 1; }
          bin="target/$TARGET/release/joedocs"
          printed="$("$bin" --version)"
          [ "$printed" = "joedocs $VERSION" ] || fail "$bin --version printed '$printed', not 'joedocs $VERSION'"
          if [ "$RUNNER_OS" = Linux ]; then
            if readelf -lW "$bin" | grep -q INTERP; then fail "$bin has a program interpreter: not static"; fi
            if readelf -dW "$bin" | grep -q NEEDED; then fail "$bin needs shared libraries: not static"; fi
          fi

      - name: Package
        env:
          # No macOS extended attributes (._ files) in the archive.
          COPYFILE_DISABLE: "1"
        run: |
          name="joedocs-$VERSION-$TARGET"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp "target/$TARGET/release/joedocs" LICENSE README.md "$stage/"
          tar -czf "dist/$name.tar.gz" -C "$stage" joedocs LICENSE README.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # An active RustSec advisory blocks a production release (AGENTS.md,
  # Security); a pre-release reports it and goes on.
  advisories:
    name: RustSec advisories
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      clear: ${{ steps.check.outputs.clear }}
      ids: ${{ steps.check.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check advisories
        id: check
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          report="$RUNNER_TEMP/advisories.txt"
          if cargo deny check advisories > "$report" 2>&1; then clear=true; else clear=false; fi
          cat "$report"
          ids="$( { grep -o 'RUSTSEC-[0-9]\{4\}-[0-9]\{4\}' "$report" || true; } | sort -u | paste -sd ' ' -)"
          echo "clear=$clear" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          {
            echo "### RustSec advisories"
            echo
            if [ "$clear" = true ]; then echo "None active."; else echo "Active: ${ids:-none named}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$clear" = true ] && exit 0
          # A failure that names no advisory means the check itself did not run
          # (for example the advisory database could not be fetched).
          [ -n "$ids" ] || fail "cargo deny check advisories failed without naming an advisory; see the report above"
          [ "$PRERELEASE" = true ] \
            || fail "active RustSec advisories ($ids): no production release until they are clear (AGENTS.md, Security)"
          echo "::warning::pre-release with active RustSec advisories: $ids; it goes to GitHub only and lists them"

  dry-run:
    name: Dry-run publish
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, ci, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  # Production releases only, and only with no active advisory.
  publish:
    name: Publish to crates.io
    if: >-
      github.event_name == 'push' &&
      needs.verify.outputs.prerelease == 'false' &&
      needs.advisories.outputs.clear == 'true'
    needs: [verify, ci, binaries, advisories]
    runs-on: ubuntu-24.04
    # Waits for a reviewer; crates.io accepts Trusted Publishing only from
    # this workflow and environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The tap's App key is an environment secret, so the dispatch runs in
      # this approved job rather than waiting for a second approval.
      - name: Skip the Homebrew dispatch
        if: vars.TAP_BOT_CLIENT_ID == ''
        run: echo "::notice::TAP_BOT_CLIENT_ID is not set; the tap's daily check or 'gh workflow run bump-formula.yml -R joelee/homebrew-oss' bumps the formula"

      - name: Get a token for joelee/homebrew-oss
        if: vars.TAP_BOT_CLIENT_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TAP_BOT_PRIVATE_KEY }}
          owner: joelee
          repositories: homebrew-oss
          permission-contents: write

      - name: Ask the Homebrew tap to bump the formula
        if: vars.TAP_BOT_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh api repos/joelee/homebrew-oss/dispatches \
            -f event_type=formula-release \
            -f "client_payload[formula]=joedocs" \
            -f "client_payload[version]=$VERSION"

  # A pre-release goes to GitHub only (never crates.io or Homebrew), after
  # approval in the same environment as a production release.
  approve-prerelease:
    name: Approve the pre-release
    if: github.event_name == 'push' && needs.verify.outputs.prerelease == 'true'
    needs: [verify, ci, binaries, advisories]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Approved
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IDS: ${{ needs.advisories.outputs.ids }}
        run: |
          echo "Pre-release $VERSION approved for GitHub only; active RustSec advisories: ${IDS:-none}"

  github-release:
    name: GitHub release
    # A production release runs once the crate is published, even if the
    # Homebrew dispatch failed; a pre-release once it is approved.
    if: >-
      always() &&
      (needs.publish.outputs.published == 'true' ||
       needs.approve-prerelease.result == 'success')
    needs: [verify, binaries, advisories, publish, approve-prerelease]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the build-provenance attestations.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          count="$(find dist -maxdepth 1 -name 'joedocs-*.tar.gz' | wc -l)"
          [ "$count" -eq 3 ] || { echo "::error::expected 3 archives in dist, found $count"; exit 1; }
          (cd dist && shasum -a 256 joedocs-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/joedocs-*.tar.gz

      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          IDS: ${{ needs.advisories.outputs.ids }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$VERSION]" \
            'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' \
            CHANGELOG.md > "$notes"
          flags=()
          if [ "$PRERELEASE" = true ]; then
            {
              if [ -n "$IDS" ]; then
                echo
                echo "### Active RustSec advisories"
                echo
                for id in $IDS; do
                  echo "- [$id](https://rustsec.org/advisories/$id)"
                done
              fi
              echo
              echo "Not for production use."
            } >> "$notes"
            flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --verify-tag --title "JoeDocs $VERSION" "${flags[@]}" \
            --notes-file "$notes" \
            dist/joedocs-*.tar.gz dist/SHA256SUMS

  # Builds the image from the binaries just built and smoke-tests it, on a
  # tag push and in a dry run alike. No registry, environment or secret.
  image:
    name: Container image (build and smoke test)
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-linux-musl
          merge-multiple: true
          path: archives

      - name: Unpack the binaries for the release target
        run: |
          (cd archives && shasum -a 256 joedocs-*.tar.gz)
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            mkdir -p "dist/linux/$arch"
            tar -xzf "archives/joedocs-$VERSION-${pair#*:}-unknown-linux-musl.tar.gz" \
              -C "dist/linux/$arch" joedocs
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64
          load: true
          tags: joedocs:smoke

      - name: Smoke test (no volumes; healthy; the first-run banner)
        run: |
          fail() { echo "::error::$*"; docker logs smoke || true; exit 1; }
          printed="$(docker run --rm joedocs:smoke joedocs --version)"
          [ "$printed" = "joedocs $VERSION" ] || fail "the image's joedocs --version printed '$printed'"
          docker run -d --name smoke joedocs:smoke
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] || fail "the container is $status after 60 s, not healthy"
          logs="$(docker logs smoke 2>/dev/null)"
          grep -q 'JoeDocs is ready' <<<"$logs" || fail "no first-run banner"
          grep -q '^   User:      admin$' <<<"$logs" || fail "the banner names no user admin"
          docker rm -f -v smoke

      - name: Build both platforms (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: false

  # Pushes the images once the GitHub release exists, so they follow its
  # approval and the advisory gate. The Docker Hub token is a secret of the
  # `release` environment, so this job asks for approval again.
  image-publish:
    name: Publish the container images
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.image.result == 'success' &&
      needs.github-release.result == 'success'
    needs: [verify, image, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      packages: write
      # For the GitHub attestation of the image digest.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      DOCKERHUB_IMAGE: docker.io/joeworks/joedocs
      GHCR_IMAGE: ghcr.io/joelee/joedocs
    steps:
      - name: Check the Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=()
          [ -n "$DOCKERHUB_USERNAME" ] || missing+=("the variable DOCKERHUB_USERNAME")
          [ "$HAS_TOKEN" = true ] || missing+=("the secret DOCKERHUB_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::set ${missing[*]} in the release environment (docs/developer-guide.md, Releasing)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-linux-musl
          merge-multiple: true
          path: archives

      - name: Check the binaries against the release's SHA256SUMS and unpack them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir archives
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            archive="joedocs-$VERSION-${pair#*:}-unknown-linux-musl.tar.gz"
            (cd archives && grep " $archive\$" SHA256SUMS | shasum -a 256 --check) \
              || { echo "::error::$archive does not match the release's SHA256SUMS"; exit 1; }
            mkdir -p "dist/linux/$arch"
            tar -xzf "archives/$archive" -C "dist/linux/$arch" joedocs
          done

      - name: Work out the tags
        id: tags
        run: |
          # A pre-release (X.Y.Z-<pre>) gets its exact version only; a
          # production release gets X.Y.Z, X.Y and latest.
          tags_for() {
            case "$1" in
              *-*) echo "$1" ;;
              *) echo "$1"; echo "${1%.*}"; echo latest ;;
            esac
          }
          {
            echo "list<<EOF"
            for tag in $(tags_for "$VERSION"); do
              echo "$DOCKERHUB_IMAGE:$tag"
              echo "$GHCR_IMAGE:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push both platforms
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=JoeDocs
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Container images"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
