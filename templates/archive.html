{% extends "layout.html" %}
{% block content %}
<div class="page-head">
  <h1>Archive</h1>
  <p class="lede">Archived documents keep their history and can be restored. Archived files of a multi-file document are restored from its History.</p>
</div>

{% if let Some(message) = notice %}<p class="notice ok" role="status">{{ message }}</p>{% endif %}

<form class="filters" method="get" action="/admin/archive"
      hx-get="/admin/archive" hx-trigger="change, submit" hx-target="#results" hx-push-url="true">
  <div>
    <label for="ar-project">Project</label>
    <select id="ar-project" name="project">
      {% for choice in projects %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="ar-type">Type</label>
    <select id="ar-type" name="type">
      {% for choice in types %}<option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filters-apply"><button type="submit">Show</button></div>
</form>

<section id="results" class="results" aria-label="Archived documents" data-focus="keep" data-announce="Archive updated">
{{ results|safe }}
</section>
{% endblock %}
