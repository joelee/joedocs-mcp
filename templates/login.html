{% extends "base.html" %}
{% block body %}
<main class="login" id="main">
  <h1>Sign in to JoeDocs</h1>
  {% if let Some(error) = error %}
  <p class="notice error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/admin/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" required>
    <label for="code">Code from your authenticator</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">An admin token comes from <code>joedocs admin-token create</code> on the server.</p>
</main>
{% endblock %}
