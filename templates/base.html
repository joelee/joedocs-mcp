<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ title }} - JoeDocs</title>
<link rel="icon" href="{{ assets.icon|safe }}" sizes="16x16 32x32 48x48">
