{% extends "base.html" %}
{% block body %}
<main id="main">
  <h1>JoeDocs</h1>
  <p>Signed in as <strong>{{ admin }}</strong> until {{ expires_at }}.</p>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Sign out</button>
  </form>
</main>
{% endblock %}
