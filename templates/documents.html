{% extends "layout.html" %}
{% block content %}
<div class="page-head">
  <h1>Documents</h1>
</div>

{% if projects.is_empty() %}
<p class="empty">No projects yet. <a href="/admin/projects">Add one</a> to start.</p>
{% else %}
<form class="filters" id="documents-filters" method="get" action="/admin/documents"
      hx-get="/admin/documents" hx-trigger="change, submit" hx-target="#results" hx-push-url="true">
  <div>
    <label for="f-project">Project</label>
    <select id="f-project" name="project">
      {% for choice in projects %}
      <option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="f-type">Type</label>
    <select id="f-type" name="type">
      {% for choice in types %}
      <option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="f-status">Status</label>
    <select id="f-status" name="status">
      {% for choice in statuses %}
      <option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="filters-apply"><button type="submit">Show</button></div>
</form>

<section id="results" class="results" aria-label="Documents" data-focus="keep" data-announce="Documents updated">
{{ results|safe }}
</section>
{% endif %}
{% endblock %}
