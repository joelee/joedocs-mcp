# Example configuration listing every key with its default value.
# Copy to one of the lookup locations (see docs/configuration.md) and edit.
# This file is checked by tests/config_example.rs: keep it in sync with the
# schema in src/config/mod.rs.

[log]
# Minimum level written to stderr: error, warn, info, debug or trace.
level = "info"

[server]
# Address and port the MCP server listens on. Keep it on localhost and put a
# TLS reverse proxy (or Tailscale) in front for remote clients.
bind = "127.0.0.1:8750"
# Host header values to accept (DNS-rebinding protection), as host or
# host:port. Behind a reverse proxy, add the public name, e.g.
# ["localhost", "127.0.0.1", "::1", "docs.example.net"].
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
# Origin header values to accept, e.g. ["https://docs.example.net"]. Requests
# without an Origin header (CLI and desktop clients) are always allowed.
allowed_origins = []
# Largest accepted document (front matter and body), in bytes.
max_document_bytes = 1048576

[storage]
# Content directory ($JOEDOCS_HOME): <project>/<type>/*.md. Absolute path.
# Empty means not set; commands that need it fail until it is.
home = ""
# Database and history directory. Absolute path. Empty means
# $XDG_DATA_HOME/joedocs, or ~/.local/share/joedocs.
state_dir = ""

[documents]
# Document types; each is a folder under every project. "all" is reserved.
types = ["home", "plans", "ideas", "issues", "reviews", "research", "specs", "notes"]
# Allowed values of the status front matter key.
statuses = ["draft", "review", "approved", "rejected", "superseded", "done"]
# Type and status used when a new document names none.
default_type = "home"
default_status = "draft"
# Write INDEX.md, a table of the live documents sorted by ID, in each project
# folder. When false, existing INDEX.md files are left in place.
index_file = true
# Most live sub-files a multi-file document may hold, besides its main file.
max_files = 500

[admin]
# Serve the remote admin API under /admin/v1/ so `joedocs` on another
# machine can run admin commands. Off by default. Callers need an admin token
# (`joedocs admin-token create`) and a TOTP code from their authenticator.
enabled = false
# How long a session opened by `joedocs login` lasts, in hours (1 to 168).
session_hours = 8

[client]
# The server whose admin API this machine uses, e.g.
# "https://docs.example.ts.net". When set, admin commands (project, key,
# archive, check, reindex, status, get, backup) run on that server after
# `joedocs login`. Empty means the local store. The admin token comes from
# JOEDOCS_ADMIN_TOKEN, never from this file.
server = ""
